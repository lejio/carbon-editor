<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>CarbonEditor</title>
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <base data-trunk-public-url />
    <style>
        html {
            touch-action: manipulation;
        }

        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background: #101114;
        }

        canvas {
            margin: 0;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e2e4ea;
            font-size: 16px;
            font-family: sans-serif;
            text-align: center;
        }

        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid #569cd6;
            border-color: #569cd6 transparent #569cd6 transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="centered" id="loading_text">
        <noscript>JavaScript is required to view CarbonEditor.</noscript>
        <p>Loading CarbonEditor…</p>
        <div class="lds-dual-ring"></div>
    </div>
</body>
</html>
